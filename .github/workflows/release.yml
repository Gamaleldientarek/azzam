name: Release

# Tags follow Claude Code's convention, <plugin-name>--v<version>, as `claude plugin tag` creates them.
on:
  push:
    tags: ["azzam--v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks, and the tag matches the plugin version
        run: python3 tests/check.py --tag "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release-notes.py "${GITHUB_REF_NAME#azzam--}" > release-notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Azzam ${GITHUB_REF_NAME#azzam--}" --notes-file release-notes.md --verify-tag
